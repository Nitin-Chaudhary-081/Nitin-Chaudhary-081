<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-label="Nitin Chaudhary — Robotics and AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.5" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="robothead" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#64748b"/>
      <stop offset="1" stop-color="#1e293b"/>
    </radialGradient>
    <linearGradient id="metalg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#475569"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <!-- motion paths used by animateMotion -->
    <path id="circuit1" d="M20 40 H60 V90 H110" fill="none" stroke="none"/>
    <path id="circuit2" d="M20 60 H45 V130 H90" fill="none" stroke="none"/>
    <path id="circuit3" d="M20 120 H50 L70 100 H110" fill="none" stroke="none"/>
    <path id="ringpath1" d="M0 0 m-95 0 a95 32 0 1 0 190 0 a95 32 0 1 0 -190 0" fill="none" stroke="none"/>
    <path id="ringpath2" d="M0 0 m-85 0 a85 28 0 1 0 170 0 a85 28 0 1 0 -170 0" fill="none" stroke="none"/>
    <path id="ringpath3" d="M0 0 m-70 0 a70 22 0 1 0 140 0 a70 22 0 1 0 -140 0" fill="none" stroke="none"/>
    <path id="orbitpath" d="M0 0 m-44 0 a44 44 0 1 0 88 0 a44 44 0 1 0 -88 0" fill="none" stroke="none"/>
  </defs>

  <!-- background -->
  <rect width="900" height="320" rx="20" fill="url(#bg)"/>
  <path d="M0 300 Q 225 240 450 300 T 900 300" fill="none" stroke="#334155" stroke-width="1" opacity="0.5"/>
  <path d="M0 315 Q 225 260 450 315 T 900 315" fill="none" stroke="#334155" stroke-width="1" opacity="0.4"/>

  <!-- ===== circuit traces (left) ===== -->
  <g stroke="#22d3ee" stroke-width="2" fill="none" opacity="0.7" stroke-linecap="round">
    <path d="M20 40 H60 V90 H110"/>
    <path d="M20 60 H45 V130 H90"/>
    <path d="M20 120 H50 L70 100 H110"/>
  </g>
  <!-- flowing electrons -->
  <circle r="3.5" fill="#22d3ee" filter="url(#glow)">
    <animateMotion dur="2.2s" repeatCount="indefinite">
      <mpath href="#circuit1"/>
    </animateMotion>
  </circle>
  <circle r="3.5" fill="#a855f7" filter="url(#glow)">
    <animateMotion dur="2.8s" repeatCount="indefinite" begin="0.8s">
      <mpath href="#circuit2"/>
    </animateMotion>
  </circle>
  <circle r="3" fill="#f472b6" filter="url(#glow)">
    <animateMotion dur="3.2s" repeatCount="indefinite" begin="1.4s">
      <mpath href="#circuit3"/>
    </animateMotion>
  </circle>

  <!-- ===== rotating 3D rings (center) ===== -->
  <g transform="translate(450 150)">
    <ellipse rx="95" ry="32" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.35" transform="rotate(12)">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="16s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="85" ry="28" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.4" transform="rotate(-18)">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="11s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="70" ry="22" fill="none" stroke="#f472b6" stroke-width="1.5" opacity="0.45" transform="rotate(8)">
      <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="8s" repeatCount="indefinite"/>
    </ellipse>
    <!-- ring nodes -->
    <circle r="5" fill="#22d3ee" filter="url(#glow)">
      <animateMotion dur="16s" repeatCount="indefinite">
        <mpath href="#ringpath1"/>
      </animateMotion>
    </circle>
    <circle r="5" fill="#a855f7" filter="url(#glow)">
      <animateMotion dur="11s" repeatCount="indefinite">
        <mpath href="#ringpath2"/>
      </animateMotion>
    </circle>
    <circle r="4" fill="#f472b6" filter="url(#glow)">
      <animateMotion dur="8s" repeatCount="indefinite">
        <mpath href="#ringpath3"/>
      </animateMotion>
    </circle>

    <!-- robot body -->
    <!-- antenna -->
    <line x1="0" y1="-62" x2="0" y2="-88" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-92" r="4" fill="#fbbf24" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.1s" repeatCount="indefinite"/>
    </circle>
    <!-- antenna signal arcs -->
    <g stroke="#fbbf24" stroke-width="1.5" fill="none" opacity="0">
      <path d="M-14 -92 Q 0 -104 14 -92"/>
      <path d="M-20 -92 Q 0 -112 20 -92"/>
      <path d="M-26 -92 Q 0 -120 26 -92"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="2.4s" repeatCount="indefinite"/>
    </g>
    <!-- head -->
    <rect x="-28" y="-60" width="56" height="44" rx="10" fill="url(#robothead)" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- eyes -->
    <rect x="-18" y="-48" width="10" height="8" rx="3" fill="#22d3ee" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.5;1" dur="1.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="8" y="-48" width="10" height="8" rx="3" fill="#22d3ee" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.5;1" dur="1.6s" repeatCount="indefinite" begin="0.4s"/>
    </rect>
    <!-- mouth -->
    <rect x="-10" y="-34" width="20" height="4" rx="2" fill="#38bdf8"/>
    <!-- neck -->
    <rect x="-6" y="-16" width="12" height="8" fill="#475569"/>
    <!-- body -->
    <rect x="-24" y="-8" width="48" height="34" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- chest light -->
    <circle cx="0" cy="6" r="5" fill="#a855f7" filter="url(#glow)">
      <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- body circuit strip -->
    <g stroke="#22d3ee" stroke-width="1.5" fill="none" opacity="0.8">
      <path d="M-16 16 H16"/>
      <path d="M-10 22 H10"/>
    </g>
    <!-- arms -->
    <line x1="-24" y1="-4" x2="-40" y2="14" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
    <circle cx="-42" cy="16" r="5" fill="#22d3ee" filter="url(#glow)">
      <animate attributeName="r" values="4;6;4" dur="1.3s" repeatCount="indefinite"/>
    </circle>
    <line x1="24" y1="-4" x2="40" y2="14" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
    <circle cx="42" cy="16" r="5" fill="#22d3ee" filter="url(#glow)">
      <animate attributeName="r" values="4;6;4" dur="1.3s" repeatCount="indefinite" begin="0.6s"/>
    </circle>
    <!-- legs -->
    <line x1="-12" y1="26" x2="-14" y2="48" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
    <line x1="12" y1="26" x2="14" y2="48" stroke="#475569" stroke-width="5" stroke-linecap="round"/>

    <!-- ===== radar rings (center, pulsing out) ===== -->
    <circle r="30" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="30;130" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="30" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="30;130" dur="3s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="opacity" values="0.8;0" dur="3s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <circle r="30" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="30;130" dur="3s" repeatCount="indefinite" begin="2s"/>
      <animate attributeName="opacity" values="0.8;0" dur="3s" repeatCount="indefinite" begin="2s"/>
    </circle>
  </g>

  <!-- ===== spinning gear (right) ===== -->
  <g transform="translate(790 90)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="9s" repeatCount="indefinite"/>
      <circle r="26" fill="none" stroke="url(#cyber)" stroke-width="3"/>
      <circle r="9" fill="#1e293b" stroke="url(#cyber)" stroke-width="2"/>
      <g stroke="url(#cyber)" stroke-width="3" stroke-linecap="round">
        <line x1="0" y1="-30" x2="0" y2="-20"/>
        <line x1="0" y1="20" x2="0" y2="30"/>
        <line x1="-30" y1="0" x2="-20" y2="0"/>
        <line x1="20" y1="0" x2="30" y2="0"/>
        <line x1="-21" y1="-21" x2="-14" y2="-14"/>
        <line x1="14" y1="14" x2="21" y2="21"/>
        <line x1="21" y1="-21" x2="14" y2="-14"/>
        <line x1="-14" y1="14" x2="-21" y2="21"/>
      </g>
    </g>
  </g>
  <!-- second smaller gear -->
  <g transform="translate(748 150)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="6s" repeatCount="indefinite"/>
      <circle r="15" fill="none" stroke="#f472b6" stroke-width="2.5"/>
      <circle r="5" fill="#1e293b" stroke="#f472b6" stroke-width="1.5"/>
      <g stroke="#f472b6" stroke-width="2.5" stroke-linecap="round">
        <line x1="0" y1="-18" x2="0" y2="-13"/>
        <line x1="0" y1="13" x2="0" y2="18"/>
        <line x1="-18" y1="0" x2="-13" y2="0"/>
        <line x1="13" y1="0" x2="18" y2="0"/>
      </g>
    </g>
  </g>
  <!-- floating code symbols -->
  <g fill="#22d3ee" font-family="monospace" font-size="16" opacity="0.8">
    <text x="700" y="60">&lt;/&gt;</text>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="3s" repeatCount="indefinite"/>
  </g>
  <g fill="#a855f7" font-family="monospace" font-size="16" opacity="0.8">
    <text x="726" y="230">&#123;&#125;</text>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="3.6s" repeatCount="indefinite" begin="0.5s"/>
  </g>
  <g fill="#f472b6" font-family="monospace" font-size="15" opacity="0.7">
    <text x="836" y="210">robot.on()</text>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="2.8s" repeatCount="indefinite" begin="1s"/>
  </g>

  <!-- ===== orbiting planet around gear ===== -->
  <g transform="translate(790 90)">
    <circle r="44" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.3" stroke-dasharray="3 5">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle r="4.5" fill="#22d3ee" filter="url(#glow)">
      <animateMotion dur="12s" repeatCount="indefinite">
        <mpath href="#orbitpath"/>
      </animateMotion>
    </circle>
  </g>

  <!-- ===== text block (right of robot) ===== -->
  <g font-family="sans-serif">
    <text x="560" y="120" fill="#e2e8f0" font-size="30" font-weight="700">Hi, I'm <tspan fill="url(#cyber)">Nitin</tspan></text>
    <text x="560" y="152" fill="#94a3b8" font-size="16">Student &#183; Robotics &#183; AI</text>
    <text x="560" y="178" fill="#cbd5e1" font-size="13">building agents, robots &amp; full-stack apps</text>
    <text x="560" y="198" fill="#64748b" font-size="12">curious about the world &#183; aiming high</text>
    <line x1="560" y1="214" x2="760" y2="214" stroke="url(#cyber)" stroke-width="2" opacity="0.6"/>
  </g>
</svg>